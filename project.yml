name: NativeTavern
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.0"
    CLANG_CXX_LANGUAGE_STANDARD: c++17
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "0.3.1"
    CURRENT_PROJECT_VERSION: "6"
targets:
  NativeTavern:
    type: application
    platform: iOS
    sources:
      - path: App/NativeTavern
      - path: Engine
        type: folder
        buildPhase: resources
    dependencies:
      - framework: Vendor/NodeMobile.xcframework
        embed: true
        codeSign: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.example.nativetavern
        SWIFT_OBJC_BRIDGING_HEADER: App/NativeTavern/NativeBridge.h
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Native Tavern
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
schemes:
  NativeTavern:
    build:
      targets:
        NativeTavern: all
    run:
      config: Debug
